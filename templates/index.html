<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🚗 YOLO + Gemini Voice Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            color: #60a5fa;
            margin: 30px 0 10px;
            font-size: 2rem;
            text-align: center;
        }

        #video {
            border: 4px solid #3b82f6;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

        #output {
            background-color: #1e293b;
            color: #f1f5f9;
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 640px;
            font-size: 1.1rem;
            text-align: left;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🚦 YOLO + Gemini Voice Assistant</h1>

    <img id="video" src="{{ url_for('video_feed') }}" width="640" height="480" />

    <div id="camBanner" class="cam-banner" hidden>📷 Camera offline — reconnecting… (detection paused)</div>
    <div id="status" class="status none">
        <span id="light">⏳ Waiting for detection...</span>
        <span id="distance"></span>
    </div>
    <p id="output"></p>
    <p id="perf" class="perf"></p>

    <label class="toggle">
        <input type="checkbox" id="browserVoice"> Also speak advice in this browser
    </label>

    <div id="trip" class="trip" hidden>
        <h3>Today's trip</h3>
        <div class="trip-grid">
            <div><b id="tripLights">0</b><span>lights</span></div>
            <div><b id="tripReds">0</b><span>red stops</span></div>
            <div><b id="tripAvg">-</b><span>avg red wait</span></div>
            <div><b id="tripLongest">-</b><span>longest wait</span></div>
        </div>
        <p id="tripMix" class="muted"></p>
    </div>

    <h3>Recent light changes <a class="log-link" href="/download_log" download>⬇ Download today's trip log (CSV)</a></h3>
    <ul id="history"><li class="muted">No changes yet</li></ul>

    <style>
        .status { display: inline-flex; gap: 1rem; align-items: center; padding: 0.6rem 1.2rem;
                  border-radius: 999px; font-size: 1.3rem; font-weight: bold; margin-top: 1rem; }
        .status.red { background: #ffdddd; color: #b00000; }
        .status.yellow { background: #fff4cc; color: #8a6d00; }
        .status.green { background: #ddffdd; color: #006400; }
        .status.none { background: #eee; color: #555; }
        #output { white-space: pre-wrap; max-width: 640px; margin: 1rem auto; }
        #history { list-style: none; padding: 0; max-width: 640px; margin: 0 auto; text-align: left; }
        #history li { padding: 0.25rem 0; border-bottom: 1px solid #eee; }
        .muted { color: #888; }
        .cam-banner { margin: 1rem auto 0; max-width: 640px; padding: 0.6rem 1rem; border-radius: 10px;
                      background: #fff3cd; color: #7a5b00; font-weight: bold; }
        .perf { color: #888; font-size: 0.8rem; margin: -0.5rem 0 0.5rem; }
        .log-link { font-size: 0.8rem; font-weight: normal; margin-left: 0.5rem; }
        .trip { max-width: 640px; margin: 1rem auto; }
        .trip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
        .trip-grid div { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 0.5rem; }
        .trip-grid b { display: block; font-size: 1.3rem; }
        .trip-grid span { font-size: 0.75rem; opacity: 0.7; }
        @media (max-width: 480px) { .trip-grid { grid-template-columns: repeat(2, 1fr); } }
        .toggle { display: block; margin: 0.5rem 0 1rem; color: #555; }
    </style>

    <script>
        const NO_LIGHT = "No traffic light detected";
        let lastSpokenResponse = "";

        function colorOf(label) {
            const l = (label || "").toLowerCase();
            return ["red", "yellow", "green"].find(c => l.includes(c)) || "none";
        }

        function speakText(text) {
            if (!text || !("speechSynthesis" in window)) return;
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        function renderStatus(s) {
            if (!s) return;
            document.getElementById("camBanner").hidden = s.camera_online;
            const perf = s.camera_online
                ? `${s.detection_fps} fps` + (s.inference_ms ? ` · model ${Math.round(s.inference_ms)} ms` : "")
                : "";
            document.getElementById("perf").innerText = perf;
        }

        function render(data) {
            renderStatus(data.status);
            const status = document.getElementById("status");
            const hasLight = data.label && data.label !== NO_LIGHT;
            status.className = "status " + (hasLight ? colorOf(data.label) : "none");
            document.getElementById("light").innerText = hasLight
                ? "🚦 " + data.label.replace(/_/g, " ")
                : "No traffic light in view";
            document.getElementById("distance").innerText =
                hasLight && data.distance ? `~${data.distance} m` : "";
            document.getElementById("output").innerText = data.response ? "💬 " + data.response : "";

            // The server already speaks through its own TTS; the browser voice is
            // optional and only speaks when the advice actually changes.
            if (document.getElementById("browserVoice").checked &&
                data.response && data.response !== lastSpokenResponse) {
                speakText(data.response);
            }
            lastSpokenResponse = data.response;

            const list = document.getElementById("history");
            list.innerHTML = "";
            if (!data.history || !data.history.length) {
                list.innerHTML = '<li class="muted">No changes yet</li>';
            }
            (data.history || []).forEach(h => {
                const li = document.createElement("li");
                const dist = h.distance ? ` · ~${h.distance} m` : "";
                li.textContent = `${h.time}  ${h.label.replace(/_/g, " ")}${dist}`;
                list.appendChild(li);
            });
        }

        function updateInfo() {
            fetch("/latest_detection")
                .then(r => r.json())
                .then(render)
                .catch(() => {
                    document.getElementById("light").innerText = "⚠️ Lost connection to the server";
                });
        }

        function fmtSecs(s) {
            if (s === null || s === undefined) return "-";
            s = Math.round(s);
            return s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`;
        }

        function updateTrip() {
            fetch("/trip_summary")
                .then(r => r.json())
                .then(t => {
                    document.getElementById("trip").hidden = !t.found;
                    if (!t.found) return;
                    document.getElementById("tripLights").innerText = t.total_lights;
                    document.getElementById("tripReds").innerText = t.red_waits;
                    document.getElementById("tripAvg").innerText = fmtSecs(t.avg_red_wait_s);
                    document.getElementById("tripLongest").innerText = fmtSecs(t.longest_red_wait_s);
                    const l = t.lights;
                    document.getElementById("tripMix").innerText =
                        `🔴 ${l.red} · 🟡 ${l.yellow} · 🟢 ${l.green}` +
                        ` · ${fmtSecs(t.total_red_wait_s)} waiting at reds in total` +
                        (t.camera_dropouts ? ` · ${t.camera_dropouts} camera dropout(s)` : "");
                })
                .catch(() => {});
        }

        updateInfo();
        setInterval(updateInfo, 500);
        updateTrip();
        setInterval(updateTrip, 10000);  // the summary changes slowly  // traffic lights change fast — poll twice a second
    </script>

</body>

</html>
